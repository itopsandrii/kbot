name: KBOT CI/CD Pipeline

on:
  push:
    branches: [ develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io/itopsandrii
      APP: kbot
      PLATFORM: linux
      ARCH: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    - name: Set VERSION and TAG
      id: vars
      run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          TAG=${VERSION}-$(git rev-parse --short HEAD)-${PLATFORM}-${ARCH}
          echo "TAG=$TAG" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build -f Dockerfile \
          -t $REGISTRY/$APP:$TAG \
          --build-arg BINARY_FILE=kbot-$PLATFORM-$ARCH .

    - name: Push Docker image
      run: |
        docker push $REGISTRY/$APP:$TAG

    - name: Update values.yaml with new tag
      run: |
        sed -i "s/^tag: .*/tag: $TAG/" kbot/values.yaml

    - name: Commit and push updated values.yaml
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: Update Helm values.yaml tag to ${{ env.TAG }}
        branch: develop
        file_pattern: kbot/values.yaml
      env:
        GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
